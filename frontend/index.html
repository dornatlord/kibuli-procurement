<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14532d" />
    <meta name="description" content="Procurement requests, LPOs and PPDA reports for Kibuli Secondary School." />
    <title>Kibuli Secondary School Procurement</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      The splash screen, styled here rather than with Tailwind so it shows before
      any script or stylesheet has loaded. SplashScreen.tsx renders the same
      markup while the app checks who is signed in, so the hand-over is seamless.
    -->
    <style>
      .kss-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #fff;
        background-color: #14532d;
        background-image:
          radial-gradient(circle at 85% 8%, rgb(22 163 74 / 0.4), transparent 42%),
          radial-gradient(circle at 12% 96%, rgb(74 222 128 / 0.14), transparent 38%),
          radial-gradient(rgb(255 255 255 / 0.07) 1px, transparent 1px);
        background-size: auto, auto, 24px 24px;
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .kss-splash-tile {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        width: 96px;
        height: 96px;
        padding: 10px;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12), 0 20px 44px -14px rgb(0 0 0 / 0.5);
      }
      .kss-splash-tile svg,
      .kss-splash-tile img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .kss-splash-name {
        margin-top: 24px;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .kss-splash-sub {
        margin-top: 3px;
        font-size: 14px;
        color: #86efac;
      }
      .kss-splash-bar {
        position: relative;
        overflow: hidden;
        width: 184px;
        height: 4px;
        margin-top: 36px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.14);
      }
      .kss-splash-bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 38%;
        border-radius: 999px;
        background: linear-gradient(90deg, #86efac, #fff);
        animation: kss-splash-slide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .kss-splash-hint {
        min-height: 40px;
        max-width: 320px;
        margin-top: 16px;
        font-size: 13px;
        line-height: 20px;
        color: rgb(220 252 231 / 0.78);
      }
      @keyframes kss-splash-slide {
        from {
          transform: translateX(-105%);
        }
        to {
          transform: translateX(270%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .kss-splash-bar span {
          width: 100%;
          animation: kss-splash-breathe 2.4s ease-in-out infinite;
        }
        @keyframes kss-splash-breathe {
          50% {
            opacity: 0.35;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="kss-splash" role="status">
        <div class="kss-splash-tile" aria-hidden="true"><!-- kss-badge --></div>
        <div class="kss-splash-name">Kibuli Secondary School</div>
        <div class="kss-splash-sub">Procurement System</div>
        <div class="kss-splash-bar" aria-hidden="true"><span></span></div>
        <div class="kss-splash-hint">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
